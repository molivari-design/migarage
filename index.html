<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi Garage</title>
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0b">
<meta name="apple-mobile-web-app-title" content="Mi Garage">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script>(function(){var t='auto';try{t=localStorage.getItem('migarage_theme')||'auto'}catch(e){}var d=t==='dark'||(t==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light'})()</script>
<style>
:root,[data-theme=light]{--red:#e0102a;--ok:#16a34a;--warn:#e5a000;--okbg:#e7f6ec;--warnbg:#fdf3d9;--badbg:#fde6e9;--bg:#fff;--card:#f4f4f5;--card2:#e9e9eb;--line:#e4e4e7;--tx:#111113;--mut:#6b6b72;--dim:#a1a1a8;--inv:#fff;--hero:#17171a;--hero2:#3b3b40;--sheet:#fff;--ov:rgba(0,0,0,.35);--navbg:rgba(255,255,255,.92)}
[data-theme=dark]{--red:#ff2d43;--ok:#22c55e;--warn:#f5b524;--okbg:#10291a;--warnbg:#33280b;--badbg:#3a1217;--bg:#0a0a0b;--card:#151517;--card2:#202023;--line:#26262a;--tx:#f4f4f5;--mut:#a1a1a8;--dim:#66666d;--inv:#0a0a0b;--hero:#18181b;--hero2:#38383d;--sheet:#131315;--ov:rgba(0,0,0,.6);--navbg:rgba(14,14,16,.92)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--tx);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;padding-bottom:calc(84px + env(safe-area-inset-bottom));transition:background .2s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;outline:none;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
input:focus,select:focus,textarea:focus{border-color:var(--tx)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:calc(10px + env(safe-area-inset-top))}
.hrow{display:flex;align-items:center;gap:8px;padding-bottom:8px}
.brand{font-weight:800;letter-spacing:1.5px;font-size:12px;text-transform:uppercase}
.sp{flex:1}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.ib svg{width:20px;height:20px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--mut);white-space:nowrap}
.chip.on{background:var(--tx);color:var(--inv);border-color:var(--tx)}
/* héroe */
.hero{position:relative;margin:0 -16px 0;background:var(--hero);color:#fff;padding:18px 20px 0;overflow:hidden}
.hero .eyb{font-size:13px;color:#a1a1a8;font-weight:500}
.hero .vname{font-size:30px;font-weight:800;letter-spacing:-.6px;line-height:1.1;margin-top:2px}
.hero .vsub{color:#a1a1a8;font-size:13.5px;margin-top:3px}
.hero .car{position:relative;z-index:1;height:190px;display:flex;align-items:flex-end;justify-content:center;margin-top:4px}
.hero .car img{max-width:88%;max-height:180px;filter:drop-shadow(0 14px 12px rgba(0,0,0,.35))}
.hero .glow{position:absolute;left:50%;bottom:30px;width:120%;height:220px;transform:translateX(-50%);background:radial-gradient(closest-side,var(--hero2),transparent);pointer-events:none}
.hero .curve{position:absolute;left:-15%;right:-15%;bottom:-70px;height:120px;background:var(--bg);border-radius:50%;z-index:0}
.hero .addph{position:absolute;right:14px;top:16px;z-index:2;font-size:12px;font-weight:600;color:#d4d4d8;border:1px solid #3a3a3f;border-radius:999px;padding:6px 11px}
.hero .ph{width:240px;color:#4a4a50}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px}
.odo{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.odo .l{font-size:12px;color:var(--mut);font-weight:600}
.odo .n{font-size:34px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1.1}
.odo .u{font-size:15px;color:var(--mut);font-weight:600;margin-left:4px}
.odo .d{font-size:12px;color:var(--mut);margin-top:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:999px;font-weight:700;font-size:14px;background:var(--tx);color:var(--inv)}
.btn.sec{background:transparent;color:var(--tx);border:1px solid var(--line)}
.btn.ghost{background:none;color:var(--mut);padding:8px 6px;font-weight:600}
.btn.danger{background:transparent;color:var(--tx);border:1px solid var(--tx)}
.btn.full{width:100%}
.btn svg{width:17px;height:17px}
.h2{font-size:18px;font-weight:800;letter-spacing:-.3px;margin:24px 2px 10px;display:flex;align-items:center;justify-content:space-between}
.h2 button{font-size:13.5px;color:var(--mut);font-weight:600}
.h2 button:after{content:' ›'}
.svc{display:flex;gap:16px;align-items:center}
.ring{flex:none;width:88px;height:88px;position:relative}
.ring svg{width:88px;height:88px;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:11px;color:var(--mut);line-height:1.15}
.ring .c b{display:block;font-size:18px;color:var(--tx);font-weight:800}
.svc .t{font-size:17px;font-weight:700}
.svc .m{color:var(--mut);font-size:13px;margin-top:3px}
.pill{font-size:11px;color:var(--mut);font-weight:700;letter-spacing:.8px;text-transform:uppercase}
.qa{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11.5px;font-weight:600;color:var(--mut);padding:4px 0}
.qa .ic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--tx)}
.qa svg{width:21px;height:21px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border-radius:16px;padding:12px}
.stat .l{font-size:11.5px;color:var(--mut);font-weight:600}
.stat .v{font-size:18px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.stat .s{font-size:11px;color:var(--mut);margin-top:2px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0;padding-top:2px}
.row:last-child{padding-bottom:2px}
.row .main{flex:1;min-width:0}
.row .tt{font-weight:600;font-size:14.5px}
.row .ss{font-size:12.5px;color:var(--mut);margin-top:2px}
.row .rt{text-align:right;font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .rt small{display:block;font-weight:500;color:var(--mut);font-size:11.5px}
.clk{cursor:pointer}
.dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--ok)}
.dot.warn{background:var(--warn)}.dot.bad{background:var(--red)}.dot.info{background:transparent;border:2px solid var(--dim)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--card2);color:var(--mut);white-space:nowrap}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.warn{background:var(--warnbg);color:var(--warn)}.tag.bad{background:var(--badbg);color:var(--red)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.bar{height:4px;border-radius:4px;background:var(--card2);overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--ok)}
.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--red)}.bar i.acc{background:var(--red)}
.ricon{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--card2);color:var(--tx)}
.ricon svg{width:18px;height:18px}
.empty{text-align:center;color:var(--mut);padding:22px 10px;font-size:14px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--navbg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:600;color:var(--dim)}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--red)}
.seg{display:flex;background:var(--card);border-radius:999px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;padding:8px 4px;border-radius:999px;font-size:13px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--bg);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.12)}
[data-theme=dark] .seg button.on{background:var(--card2)}
.ov{position:fixed;inset:0;z-index:20;background:var(--ov);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.ov.on{opacity:1;pointer-events:auto}
.sheet{background:var(--sheet);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(30px);transition:transform .22s}
.ov.on .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 12px}
.sheet h3{font-size:20px;font-weight:800;letter-spacing:-.3px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f{grid-column:span 2}
.f.h{grid-column:span 1}
.f>label{display:block;font-size:12px;color:var(--mut);font-weight:600;margin:0 0 5px 2px}
.ck{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;font-size:14px;width:100%;text-align:left}
.ck input{width:20px;height:20px;accent-color:var(--tx);flex:none;-webkit-appearance:auto;appearance:auto;padding:0}
.cklist{display:grid;gap:6px;max-height:300px;overflow-y:auto}
.mchk{display:flex;flex-wrap:wrap;gap:6px}
.mchk label{position:relative}
.mchk input{position:absolute;opacity:0;pointer-events:none}
.mchk span{display:inline-block;padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--mut)}
.mchk input:checked+span{background:var(--tx);color:var(--inv);border-color:var(--tx)}
.acts{display:flex;gap:10px;margin-top:16px}
.acts .btn{flex:1}
.note{font-size:12px;color:var(--mut);margin-top:8px;line-height:1.45}
.banner{background:var(--card);border-left:3px solid var(--tx);border-radius:10px;padding:10px 12px;font-size:13px;margin:12px 0}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--tx);color:var(--inv);padding:10px 16px;border-radius:999px;font-weight:600;font-size:13.5px;opacity:0;transition:.25s;z-index:30;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:middle}
.catrow{display:flex;justify-content:space-between;font-size:14px;padding:7px 0 4px}
.catrow span:last-child{font-weight:700;font-variant-numeric:tabular-nums}
.catbar{height:4px;border-radius:4px;background:var(--card2);margin-bottom:4px;overflow:hidden}
.catbar i{display:block;height:100%;background:var(--red)}
.loading{display:grid;place-items:center;height:60vh;color:var(--mut)}
.trip{background:var(--card);border-radius:20px;padding:16px;margin-bottom:10px;cursor:pointer}
.trip .tt{font-size:16.5px;font-weight:700;letter-spacing:-.2px}
.trip .ss{font-size:13px;color:var(--mut);margin-top:3px}
.trip .kms{display:flex;gap:18px;margin-top:10px;font-size:12px;color:var(--mut)}
.trip .kms b{display:block;color:var(--tx);font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.trip.plan{background:transparent;border:1.5px dashed var(--line)}
.cnt{display:inline-grid;place-items:center;min-width:56px;padding:6px 8px;border-radius:14px;background:var(--tx);color:var(--inv);text-align:center;line-height:1.1}
.cnt b{font-size:19px;font-weight:800;display:block}
.cnt small{font-size:10px;font-weight:600}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:18px;padding:16px;display:flex;align-items:center;gap:12px;text-align:left;font-weight:700;font-size:14.5px;line-height:1.25;min-height:78px}
.tic{flex:none;color:var(--red)}.tic svg{width:26px;height:26px}
.dt{border-top:1px solid var(--line)}.dt:first-child{border-top:0}
.dt summary{list-style:none;display:flex;align-items:center;gap:12px;padding:13px 0;cursor:pointer;font-weight:600;font-size:14.5px}
.dt summary::-webkit-details-marker{display:none}
.dt summary:after{content:'+';margin-left:auto;color:var(--mut);font-weight:400;font-size:20px;line-height:1}
.dt[open] summary:after{content:'−'}
.dt .sm{flex:1}
.dd{padding:0 0 14px 22px;font-size:14px;color:var(--tx)}.dd p{margin-bottom:6px}.dd ol{padding-left:18px}.dd li{margin-bottom:6px}.dd .wn{color:var(--mut);font-size:13px;border-left:3px solid var(--red);padding-left:10px;margin-top:8px}
a.btn{text-decoration:none}
</style>
</head>
<body>
<header><div class="wrap" id="hdr"></div></header>
<main class="wrap" id="app"><div class="loading">Cargando…</div></main>
<nav><div class="in" id="nav"></div></nav>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="photoIn" accept="image/*" hidden>

<script>
const BUNDLED_PHOTOS={hilux:'icons/hilux.webp'};
/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=(n,d=0)=>(n==null||n===''||isNaN(n))?'—':Number(n).toLocaleString('es-AR',{minimumFractionDigits:d,maximumFractionDigits:d});
const money=n=>(n==null||isNaN(n))?'—':'$ '+nf(Math.round(n));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const pd=s=>{if(!s)return null;const[a,b,c]=String(s).split('-').map(Number);return new Date(a,(b||1)-1,c||1)};
const fd=s=>{const d=pd(s);return d?pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear():'—'};
const fdm=s=>{const d=pd(s);return d?d.toLocaleDateString('es-AR',{month:'short',year:'numeric'}).replace('.',''):'—'};
const fdd=s=>{const d=pd(s);return d?d.toLocaleDateString('es-AR',{day:'numeric',month:'short'}).replace('.',''):'—'};
const addMonths=(s,m)=>{const d=pd(s);if(!d||!m)return null;return iso(new Date(d.getFullYear(),d.getMonth()+Number(m),d.getDate()))};
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+Math.round(n));return iso(d)};
const days=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o??null));
const num=v=>{if(v==null||v==='')return null;const n=Number(String(v).replace(/\./g,'').replace(',','.'));return isNaN(n)?null:n};
const numDec=v=>{if(v==null||v==='')return null;let s=String(v).trim();if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=Number(s);return isNaN(n)?null:n};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove('on'),2200)}

/* ---------- tema ---------- */
function getTheme(){try{return localStorage.getItem('migarage_theme')||'auto'}catch(e){return'auto'}}
function applyTheme(){const t=getTheme();const d=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light'}
function setTheme(t){try{localStorage.setItem('migarage_theme',t)}catch(e){}applyTheme();render()}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(getTheme()==='auto'){applyTheme();render()}})}catch(e){}

/* ---------- íconos (trazo) ---------- */
const sv=p=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';
const I={
 home:sv('<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'),
 wrench:sv('<path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L3 17.8V21h3.2l6.3-6.3a4 4 0 0 0 5.2-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/>'),
 map:sv('<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/>'),
 box:sv('<path d="M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8"/>'),
 list:sv('<path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>'),
 fuel:sv('<path d="M4 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M3 21h12M4 10h10M14 8h2a2 2 0 0 1 2 2v6a1.5 1.5 0 0 0 3 0V8l-3-3"/>'),
 wash:sv('<path d="M12 3s-5 5.5-5 9a5 5 0 0 0 10 0c0-3.5-5-9-5-9z"/>'),
 money:sv('<rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>'),
 gauge:sv('<path d="M4.9 19a9 9 0 1 1 14.2 0"/><path d="M12 14l4-5"/>'),
 plus:sv('<path d="M12 5v14M5 12h14"/>'),
 gear:sv('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'),

const S={vehicles:{},records:{},photos:{},vid:null,tab:'home',filter:'all',range:'year',gview:'list',eview:'have',mode:'loading',user:null,online:navigator.onLine,pending:0,err:null};

const CFG=window.MIGARAGE_CONFIG||{};
let SB=null,CH=null,flushing=false;
const TABLE='garage_items';
function cacheSave(){try{localStorage.setItem(CACHE,JSON.stringify({vehicles:S.vehicles,records:S.records,photos:S.photos}))}catch(e){}}
function cacheLoad(){try{const j=JSON.parse(localStorage.getItem(CACHE)||'{}');S.vehicles=j.vehicles||{};S.records=j.records||{};S.photos=j.photos||{}}catch(e){}}
function qLoad(){try{return JSON.parse(localStorage.getItem(QUEUE)||'[]')}catch(e){return[]}}
function qSave(q){try{localStorage.setItem(QUEUE,JSON.stringify(q))}catch(e){}S.pending=q.length}
function stripId(o){const{id,...b}=o;return b}
function applyItem(kind,id,data){if(kind==='vehicle'){if(data)S.vehicles[id]={...data,id};else delete S.vehicles[id]}
 else if(kind==='record'){if(data)S.records[id]={...data,id};else delete S.records[id]}
 else if(kind==='photo'){if(data)S.photos[id]=data.data;else delete S.photos[id]}}
function enqueue(op){const q=qLoad().filter(x=>!(x.kind===op.kind&&x.id===op.id));q.push(op);qSave(q);cacheSave();flush()}
const isNetErr=e=>!navigator.onLine||/fetch|network|Failed|Load failed|timeout/i.test(String(e&&(e.message||e)));
async function flush(){if(flushing||!SB||!S.user)return;flushing=true;let q=qLoad();
 while(q.length){const op=q[0];let error=null;
  try{if(op.t==='upsert'){({error}=await SB.from(TABLE).upsert({kind:op.kind,id:op.id,data:op.data,updated_at:new Date().toISOString(),updated_by:S.user.email}))}
   else{({error}=await SB.from(TABLE).delete().match({kind:op.kind,id:op.id}))}}catch(e){error=e}
  if(error){if(isNetErr(error))break;console.error(error);toast('No se pudo guardar un cambio: '+(error.message||'error'))}
  q.shift();qSave(q)}
 flushing=false;S.pending=qLoad().length;renderHdr()}
function saveVehicle(v){v=clone(v);v.updatedAt=Date.now();S.vehicles[v.id]=v;render();enqueue({t:'upsert',kind:'vehicle',id:v.id,data:stripId(v)})}
function savePhoto(vid,data){if(data)S.photos[vid]=data;else delete S.photos[vid];render();enqueue(data?{t:'upsert',kind:'photo',id:vid,data:{data}}:{t:'delete',kind:'photo',id:vid})}
function delVehicle(id){delete S.vehicles[id];const rs=Object.values(S.records).filter(r=>r.vid===id);rs.forEach(r=>delete S.records[r.id]);delete S.photos[id];pickVid(true);render();
 enqueue({t:'delete',kind:'vehicle',id});enqueue({t:'delete',kind:'photo',id});rs.forEach(r=>enqueue({t:'delete',kind:'record',id:r.id}))}
function saveRecord(r){r=clone(r);if(!r.id)r.id=uid();if(!r.createdAt)r.createdAt=Date.now();S.records[r.id]=r;render();enqueue({t:'upsert',kind:'record',id:r.id,data:stripId(r)})}
function delRecord(id){delete S.records[id];render();enqueue({t:'delete',kind:'record',id})}
const sortedVids=()=>Object.keys(S.vehicles).sort((a,b)=>(S.vehicles[a].createdAt||0)-(S.vehicles[b].createdAt||0));
function pickVid(force){let saved=null;try{saved=localStorage.getItem(LS+'_vid')}catch(e){}if(force||!S.vid||!S.vehicles[S.vid])S.vid=(saved&&S.vehicles[saved])?saved:(sortedVids()[0]||null)}
function setVid(id){S.vid=id;try{localStorage.setItem(LS+'_vid',id)}catch(e){}render()}
async function loadAll(){const{data,error}=await SB.from(TABLE).select('kind,id,data');if(error)throw error;
 S.vehicles={};S.records={};S.photos={};data.forEach(r=>applyItem(r.kind,r.id,r.data));
 qLoad().forEach(op=>applyItem(op.kind,op.id,op.t==='upsert'?op.data:null));cacheSave();pickVid();S.err=null}
function subscribe(){if(CH)return;CH=SB.channel('garage').on('postgres_changes',{event:'*',schema:'public',table:TABLE},p=>{
  const row=p.eventType==='DELETE'?p.old:p.new;if(!row||!row.kind)return;
  if(qLoad().some(op=>op.kind===row.kind&&op.id===row.id))return;
  applyItem(row.kind,row.id,p.eventType==='DELETE'?null:row.data);cacheSave();pickVid();render()}).subscribe()}
async function startSession(user){S.user=user;S.mode='app';cacheLoad();qLoad().forEach(op=>applyItem(op.kind,op.id,op.t==='upsert'?op.data:null));pickVid();S.pending=qLoad().length;render();
 if(!navigator.onLine)return;
 try{await loadAll();render();subscribe();flush()}catch(e){console.error(e);S.err=e.message||'error';
  if(/permission|policy|row-level/i.test(String(e.message)))S.err='denied';render()}}
async function init(){
 if(!CFG.supabaseUrl||!CFG.supabaseAnonKey||!window.supabase){S.mode='setup';render();return}
 SB=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true}});
 const{data}=await SB.auth.getSession();
 if(data&&data.session)startSession(data.session.user);else{S.mode='login';render()}
 SB.auth.onAuthStateChange((ev,session)=>{if(ev==='SIGNED_OUT'){S.user=null;S.mode='login';render()}});
 addEventListener('online',()=>{S.online=true;renderHdr();if(S.user){loadAll().then(()=>{render();subscribe();flush()}).catch(()=>{})}});
 addEventListener('offline',()=>{S.online=false;renderHdr()});
 document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.user&&navigator.onLine){flush();loadAll().then(render).catch(()=>{})}});
}

const V=()=>S.vehicles[S.vid];
const recsOf=vid=>Object.values(S.records).filter(r=>r.vid===vid);
const COST_TYPES=['fuel','wash','service','expense'];
function itemStatus(v,it){
 const sev=v.usage==='severo';const km=(sev&&it.kmS)?it.kmS:it.km,mo=(sev&&it.moS)?it.moS:it.mo;const last=it.lastKm||0;
 const dueKm=km?last+km:null,dueDate=(mo&&it.lastDate)?addMonths(it.lastDate,mo):null;
 const remKm=dueKm!=null?dueKm-(v.km||0):null,remD=dueDate?days(today(),dueDate):null;
 const soonKm=km?Math.max(500,Math.min(1500,km*.1)):0;let st='ok';
 if((remKm!=null&&remKm<=0)||(remD!=null&&remD<=0))st='bad';else if((remKm!=null&&remKm<=soonKm)||(remD!=null&&remD<=30))st='warn';
 const pk=km?((v.km||0)-last)/km:0,pt=(mo&&it.lastDate)?days(it.lastDate,today())/(mo*30.4):0;
 return{km,mo,dueKm,dueDate,remKm,remD,st,prog:Math.max(0,Math.min(1,Math.max(pk,pt)))}
}
function kmRate(v){const pts=recsOf(v.id).filter(r=>r.km&&r.date&&r.type!=='trip').map(r=>({d:r.date,k:r.km}));
 recsOf(v.id).filter(r=>r.type==='trip'&&r.status==='done').forEach(r=>{if(r.dateTo&&r.kmEnd)pts.push({d:r.dateTo,k:r.kmEnd})});
 if(v.kmDate)pts.push({d:v.kmDate,k:v.km});const lim=addDays(today(),-365);const p=pts.filter(x=>x.d>=lim).sort((a,b)=>a.d<b.d?-1:1);
 if(p.length<2)return null;const span=days(p[0].d,p[p.length-1].d),dk=p[p.length-1].k-p[0].k;return(span>=14&&dk>0)?dk/span:null}
function nextService(v){const ls=v.lastService||{km:0,date:null,nominal:0},step=v.serviceKm||10000,mo=v.serviceMonths||12;
 const dueKm=(ls.km||0)+step,dueDate=ls.date?addMonths(ls.date,mo):null,nominal=(ls.nominal||0)+step;
 const remKm=dueKm-(v.km||0),remD=dueDate?days(today(),dueDate):null;const rate=kmRate(v);
 let estDate=(rate&&remKm>0)?addDays(today(),remKm/rate):null;if(estDate&&dueDate&&estDate>=dueDate)estDate=null;
 const pk=((v.km||0)-(ls.km||0))/step,pt=ls.date?days(ls.date,today())/(mo*30.4):0;
 let st='ok';if(remKm<=0||(remD!=null&&remD<=0))st='bad';else if(remKm<=1000||(remD!=null&&remD<=30))st='warn';
 const first=estDate||dueDate;return{dueKm,dueDate,nominal,remKm,remD,estDate,first,st,prog:Math.max(0,Math.min(1,Math.max(pk,pt)))}}
function fuelSegs(vid){const f=recsOf(vid).filter(r=>r.type==='fuel'&&r.km&&r.liters).sort((a,b)=>a.km-b.km);const seg=[];let last=null,acc=0;
 for(const r of f){if(last){acc+=r.liters;if(r.full){const d=r.km-last.km;if(d>0)seg.push({date:r.date,km:r.km,dist:d,l:acc,l100:acc/d*100});last=r;acc=0}}else if(r.full){last=r;acc=0}}return seg}
function rangeStart(k){const d=new Date();if(k==='month')return iso(new Date(d.getFullYear(),d.getMonth(),1));if(k==='year')return iso(new Date(d.getFullYear(),0,1));if(k==='12m')return addMonths(today(),-12);return'0000-01-01'}
function catOf(r){return r.type==='expense'?(r.category||'Otro'):TYPE[r.type].s}
function costs(vid,from){const rs=recsOf(vid).filter(r=>COST_TYPES.includes(r.type)&&r.date>=from&&r.cost>0&&!(r.type==='mod'&&r.status==='want'));
 const by={};let tot=0;rs.forEach(r=>{const c=catOf(r);by[c]=(by[c]||0)+r.cost;tot+=r.cost});
 const kp=recsOf(vid).filter(r=>r.km&&r.date>=from&&r.type!=='trip').map(r=>r.km);const v=S.vehicles[vid];if(v&&v.kmDate&&v.kmDate>=from)kp.push(v.km);
 const kmT=kp.length>1?Math.max(...kp)-Math.min(...kp):null;
 const run=COST_TYPES;const runTot=rs.filter(r=>run.includes(r.type)).reduce((a,r)=>a+r.cost,0);
 return{by,tot,kmT,perKm:(kmT&&kmT>50)?runTot/kmT:null,n:rs.length}}
function tripFuel(v,t){if(!t.dateFrom)return null;const to=t.dateTo||t.dateFrom;const f=recsOf(v.id).filter(r=>r.type==='fuel'&&r.date>=t.dateFrom&&r.date<=to);
 if(!f.length)return null;return{l:f.reduce((a,r)=>a+(r.liters||0),0),c:f.reduce((a,r)=>a+(r.cost||0),0),n:f.length}}
function alerts(v){const out=[];const ns=nextService(v);
 if(ns.st!=='ok')out.push({st:ns.st,t:'Service '+nf(ns.nominal)+' km',s:ns.remKm<=0?'Pasado por '+nf(-ns.remKm)+' km':(ns.remD!=null&&ns.remD<=0?'Venció por tiempo':'Faltan '+nf(ns.remKm)+' km'+(ns.remD!=null?' · '+ns.remD+' días':'')),act:'svc'});
 (v.plan||[]).forEach(it=>{const s=itemStatus(v,it);if(s.st!=='ok')out.push({st:s.st,t:it.name,s:s.remKm!=null&&s.remKm<=0?'Pasado por '+nf(-s.remKm)+' km':s.remD!=null&&s.remD<=0?'Venció el '+fd(s.dueDate):(s.remKm!=null?'Faltan '+nf(s.remKm)+' km':'')+(s.remD!=null&&s.remD<=30?' · '+s.remD+' días':''),act:'item:'+it.id})});
 (v.issues||[]).filter(x=>!x.done).forEach(x=>out.push({st:x.prio==='urgent'?'bad':'warn',t:x.title,s:(x.prio==='urgent'?'Urgente · ':'Para revisar · ')+'desde el '+fd(x.date),act:'issue:'+x.id}));
 (v.reminders||[]).filter(x=>!x.done).forEach(x=>{let st='info',s=x.note||'';
  if(x.date){const d=days(today(),x.date);st=d<0?'bad':d<=30?'warn':'info';s=(d<0?'Venció el '+fd(x.date):d===0?'Vence hoy':'Vence el '+fd(x.date)+' ('+d+' días)')}
  if(x.km){const r=x.km-(v.km||0);if(r<=0)st='bad';s=(s?s+' · ':'')+(r<=0?'Km alcanzado':'a los '+nf(x.km)+' km')}
  if(st!=='info'||!x.date)out.push({st,t:x.name,s:s||'Pendiente',act:'rem:'+x.id})});
 if(0)recsOf(v.id).filter(r=>r.type==='trip'&&r.status==='plan'&&r.dateFrom).forEach(t=>{const d=days(today(),t.dateFrom);
  if(d>=0&&d<=30){let s=d===0?'Hoy':'En '+d+' día'+(d===1?'':'s')+' · '+fdd(t.dateFrom);if(t.estKm&&ns.remKm>0&&t.estKm>=ns.remKm)s+=' · ojo: pasarías el service';out.push({st:'info',t:'Viaje: '+(t.title||t.dest),s,act:'rec:'+t.id})}});
 const ord={bad:0,warn:1,info:2};return out.sort((a,b)=>ord[a.st]-ord[b.st])}

 if(inSvc.length)h+='<div class="h2">Qué debería incluir</div><div class="card">'+inSvc.map(it=>'<div class="row"><span class="dot '+itemStatus(v,it).st+'"></span><div class="main"><div class="tt">'+esc(it.name)+'</div></div></div>').join('')+'</div>';

const tripKm=t=>(t.kmEnd&&t.kmStart&&t.kmEnd>t.kmStart)?t.kmEnd-t.kmStart:(t.status==='plan'?t.estKm:null);
const tripSort=(a,b)=>(b.dateFrom||'').localeCompare(a.dateFrom||'')||((b.kmStart||0)-(a.kmStart||0));
function tripDates(t){if(!t.dateFrom)return'Fecha sin cargar';if(t.approx)return fdm(t.dateFrom);if(!t.dateTo||t.dateTo===t.dateFrom)return fd(t.dateFrom);

 if(plan&&t.dateFrom){const d=days(today(),t.dateFrom);if(d>=0)cnt='<div class="cnt"><b>'+d+'</b><small>'+(d===1?'día':'días')+'</small></div>'}
 const tags=[t.purpose,...(t.terrain||[]),...(t.traction||[])].filter(Boolean);
 return'<div class="trip'+(plan?' plan':'')+'" data-a="rec:'+t.id+'"><div style="display:flex;gap:12px;align-items:flex-start"><div style="flex:1;min-width:0"><div class="tt">'+esc(t.title||t.dest||'Viaje')+'</div><div class="ss">'+esc(tripDates(t))+(t.dest&&t.title&&t.title!==t.dest?' · '+esc(t.dest):'')+'</div></div>'+cnt+'</div>'+
 (tags.length?'<div class="tags">'+tags.map(x=>'<span class="tag">'+esc(x)+'</span>').join('')+'</div>':'')+
 '<div class="kms"><div><b>'+(km?nf(km):'—')+'</b>'+(plan?'km estimados':'km')+'</div>'+(t.kmStart?'<div><b>'+nf(t.kmStart)+'</b>salida</div>':'')+(t.cost?'<div><b>'+money(t.cost)+'</b>gastos</div>':'')+'</div></div>'}
function vTrips(v){const ts=recsOf(v.id).filter(r=>r.type==='trip');const plan=ts.filter(t=>t.status==='plan').sort((a,b)=>(a.dateFrom||'9').localeCompare(b.dateFrom||'9'));const done=ts.filter(t=>t.status!=='plan').sort(tripSort);

function vMoney(v){let h='<div class="seg" style="margin-top:4px">'+[['list','Registros'],['sum','Resumen']].map(([k,l])=>'<button class="'+(S.gview===k?'on':'')+'" data-a="gview:'+k+'">'+l+'</button>').join('')+'</div>';
 return h+(S.gview==='list'?vLog(v):vCosts(v))}
function vLog(v){const f=S.filter;let rs=recsOf(v.id).filter(r=>!['trip','mod','contact'].includes(r.type)).sort(byDateDesc);if(f!=='all')rs=rs.filter(r=>r.type===f);
 let h='<div class="chips">'+[['all','Todo'],['fuel','Combustible'],['wash','Lavados'],['service','Service'],['expense','Gastos'],['km','Km']].map(([k,l])=>'<button class="chip'+(f===k?' on':'')+'" data-a="filter:'+k+'">'+l+'</button>').join('')+'</div>';

 if(!rs.length)return h+'<div class="card" style="margin-top:12px"><div class="empty">No hay registros'+(f!=='all'?' de este tipo':'')+'</div></div>';
 let mon=null,out='';rs.forEach(r=>{const m=r.date?r.date.slice(0,7):'';if(m!==mon){if(mon!==null)out+='</div>';mon=m;out+='<div class="h2">'+(r.date?esc(fdm(r.date)):'Sin fecha')+'</div><div class="card">'}out+=recRow(r)});

function vCosts(v){const from=rangeStart(S.range),c=costs(v.id,from),seg=fuelSegs(v.id);
 let h='<div class="chips">'+[['month','Este mes'],['year','Este año'],['12m','12 meses'],['all','Todo']].map(([k,l])=>'<button class="chip'+(S.range===k?' on':'')+'" data-a="range:'+k+'">'+l+'</button>').join('')+'</div>';
 const fuelR=recsOf(v.id).filter(r=>r.type==='fuel'&&r.date>=from);const lt=fuelR.reduce((a,r)=>a+(r.liters||0),0);
 const sg=seg.filter(s=>s.date>=from),sl=sg.reduce((a,s)=>a+s.l,0),sd=sg.reduce((a,s)=>a+s.dist,0);
 h+='<div class="stats"><div class="stat"><div class="l">Total</div><div class="v">'+money(c.tot)+'</div><div class="s">'+c.n+' registros</div></div><div class="stat"><div class="l">Km recorridos</div><div class="v">'+(c.kmT?nf(c.kmT):'—')+'</div><div class="s">'+(c.perKm?money(c.perKm)+'/km':'—')+'</div></div>'+
 '<div class="stat"><div class="l">Consumo</div><div class="v">'+(sd?nf(sl/sd*100,1):'—')+'</div><div class="s">'+(sd?'L/100 · '+nf(sd/sl,1)+' km/L':'L/100 km')+'</div></div></div>';

 if(fuelR.length){const ppl=fuelR.filter(r=>r.ppl).sort((a,b)=>a.date<b.date?-1:1);

 h+='<div class="note">El costo por km incluye combustible, lavados, service y gastos, dividido por los km recorridos según tus registros.</div>';return h}
function monthChart(v){const d=new Date(),ms=[];for(let i=5;i>=0;i--)ms.push(iso(new Date(d.getFullYear(),d.getMonth()-i,1)).slice(0,7));
 const rs=recsOf(v.id).filter(r=>COST_TYPES.includes(r.type)&&r.cost>0&&r.date&&!(r.type==='mod'&&r.status==='want'));
 const data=ms.map(m=>{let f=0,o=0;rs.forEach(r=>{if(r.date.slice(0,7)===m){if(r.type==='fuel')f+=r.cost;else o+=r.cost}});return{m,f,o}});
 const mx=Math.max(1,...data.map(x=>x.f+x.o)),W=320,H=140,bw=28,gap=(W-bw*6)/6;let s='<svg class="chart" viewBox="0 0 '+W+' '+(H+34)+'">';
 data.forEach((x,i)=>{const X=gap/2+i*(bw+gap),hf=x.f/mx*H,ho=x.o/mx*H;
  s+='<rect x="'+X+'" y="'+(H-hf)+'" width="'+bw+'" height="'+hf+'" rx="3" fill="var(--tx)"/><rect x="'+X+'" y="'+(H-hf-ho)+'" width="'+bw+'" height="'+ho+'" rx="3" fill="var(--dim)"/>';
  s+='<text x="'+(X+bw/2)+'" y="'+(H+16)+'" fill="var(--mut)" font-size="11" text-anchor="middle" font-family="Inter">'+pd(x.m+'-01').toLocaleDateString('es-AR',{month:'short'}).replace('.','')+'</text>';
  if(x.f+x.o>0)s+='<text x="'+(X+bw/2)+'" y="'+(H+30)+'" fill="var(--mut)" font-size="9.5" text-anchor="middle" font-family="Inter">'+(x.f+x.o>=1e6?nf((x.f+x.o)/1e6,1)+'M':nf((x.f+x.o)/1e3)+'k')+'</text>'});

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;const i=a.indexOf(':');const k=i<0?a:a.slice(0,i),arg=i<0?'':a.slice(i+1);
 if(k==='tstat'||k==='mstat')return;
 if(k==='tab'){if(arg==='manual'&&S.tab==='manual')S.mview='';S.tab=arg;closeSheet();render();scrollTo(0,0)}
 else if(k==='veh')setVid(arg);
 else if(k==='addveh')vehForm(true);
 else if(k==='editveh')vehForm(false);
 else if(k==='theme')setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
 else if(k==='settheme'){setTheme(arg);el.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===el))}
 else if(k==='photo')pickPhoto();
 else if(k==='close')closeSheet();
 else if(k==='new'){closeSheet();recForm(arg)}
 else if(k==='newpick')pickNew();
 else if(k==='rec'){const r=S.records[arg];if(r)recForm(r.type,r)}
 else if(k==='filter'){S.filter=arg;render()}
 else if(k==='range'){S.range=arg;render()}
 else if(k==='gview'){S.gview=arg;render()}
 else if(k==='eview'){S.eview=arg;render()}
 else if(k==='svc'){S.tab='maint';render();scrollTo(0,0)}
 else if(k==='usage'){const nv=clone(V());nv.usage=arg;saveVehicle(nv)}
 else if(k==='item')itemForm(arg);
 else if(k==='additem')itemForm(null);
 else if(k==='itemdone'){const nv=clone(V());const it=nv.plan.find(x=>x.id===arg);if(it){it.lastKm=nv.km;it.lastDate=today();saveVehicle(nv);closeSheet();toast('Marcado como hecho')}}
 else if(k==='rem')remForm(arg);
 else if(k==='addrem')remForm(null);
 else if(k==='mview'){S.mview=arg;render();scrollTo(0,0)}
 else if(k==='contact')contactForm(arg);
 else if(k==='addcontact')contactForm(null);
 else if(k==='setmanual')manualUrlForm();
 else if(k==='offline')offlineGuide();
 else if(k==='logout')logout();
 else if(k==='issue')issueForm(arg);
 else if(k==='addissue')issueForm(null);
 else if(k==='showclosed'){S.showClosed=!S.showClosed;render()}
 else if(k==='delissue')armDelete(el,()=>{const nv=clone(V());nv.issues=(nv.issues||[]).filter(x=>x.id!==arg);saveVehicle(nv)});
 else if(k==='delrec')armDelete(el,()=>{delRecord(arg);toast('Eliminado')});
 else if(k==='delitem')armDelete(el,()=>{const nv=clone(V());nv.plan=nv.plan.filter(x=>x.id!==arg);saveVehicle(nv)});
 else if(k==='delrem')armDelete(el,()=>{const nv=clone(V());nv.reminders=nv.reminders.filter(x=>x.id!==arg);saveVehicle(nv)});
 else if(k==='delveh')armDelete(el,()=>{delVehicle(S.vid);toast('Vehículo eliminado')});
 else if(k==='export'){const txt=JSON.stringify({version:2,vehicles:S.vehicles,records:S.records});try{navigator.clipboard.writeText(txt).then(()=>toast('Respaldo copiado'),()=>showText(txt))}catch(err){showText(txt)}}
 else if(k==='import')importForm();
});
function showText(t){openSheet('Respaldo','<div class="note" style="margin:0 0 8px">Seleccioná y copiá este texto.</div><textarea rows="10" readonly>'+esc(t)+'</textarea>')}
function importForm(){openSheet('Importar respaldo','<div class="fg">'+fld('json','Pegá el texto del respaldo','',{type:'area'})+'</div><div class="note">Se agregan o reemplazan los vehículos y registros con el mismo identificador. No se borra nada.</div>'+acts(null),f=>{
 let j;try{j=JSON.parse(fv(f,'json'))}catch(e){toast('El texto no es un respaldo válido');return false}
 Object.entries(j.vehicles||{}).forEach(([id,v])=>saveVehicle({...v,id}));Object.entries(j.records||{}).forEach(([id,r])=>saveRecord({...r,id}));pickVid();toast('Respaldo importado')})}

render();init();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
